{% extends "base.html" %}
{% block title %}Contacto{% endblock %}
{% block content %}
<section class="spad">
    <div class="container">
        <div class="section-title center-title">
            <span>Contacto</span>
            <h2>Contáctanos</h2>
        </div>
        <div class="row">
            <div class="col-lg-6">
                <form class="contact-form card-dark p-4" method="post" action="#">
                    <input type="text" name="nombre" placeholder="Nombre" required />
                    <input type="email" name="correo" placeholder="Correo electronico" required />
                    <textarea name="mensaje" placeholder="Mensaje" rows="5"></textarea>
                    <button class="site-btn mt-3">Enviar mensaje</button>
                </form>
            </div>
            <div class="col-lg-6">
                <div class="card-dark p-4">
                    <h4>Contáctanos</h4>
                    <p>Teléfono: <strong>+57 300 123 4567</strong></p>
                    <p>Email: <strong>info@tuevento.com</strong></p>
                    <p>Dirección: <strong>Calle Falsa 123, Ciudad</strong></p>
                    <hr>
                    <p>Horario de atención:</p>
                    <p>Lun - Vie: 9:00 - 18:00</p>
                    <p>Sáb: 10:00 - 14:00</p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
