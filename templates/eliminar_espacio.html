{% extends "base_admin.html" %}
{% block title %}Eliminar Espacio{% endblock %}
{% block content %}
<div class="container-fluid pt-4 px-4">
    <div class="page-card p-4">
        <h2 class="mb-3">¿Eliminar este espacio?</h2>
        <p class="mb-4"><strong>{{ espacio.nombre }}</strong></p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
            <a href="{% url 'lista_espacios' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
