{% extends "base_admin.html" %}
{% block title %}Agregar Espacio{% endblock %}
{% block content %}
<div class="container-fluid pt-4 px-4">
    <div class="page-card p-4">
        <h2 class="mb-4">Nuevo Espacio</h2>
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre</label>
                    <input type="text" name="nombre" required class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Tipo</label>
                    <input type="text" name="tipo" required class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Capacidad</label>
                    <input type="number" name="capacidad" required class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Costo/hora</label>
                    <input type="number" step="0.01" name="costo_hora" required class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">Ubicación</label>
                    <input type="text" name="ubicacion" required class="form-control">
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="disponible" checked>
                        <label class="form-check-label">Disponible</label>
                    </div>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'lista_espacios' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
