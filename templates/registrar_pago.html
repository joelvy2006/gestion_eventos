{% extends "base_admin.html" %}
{% block title %}Registrar Pago{% endblock %}
{% block content %}
<div class="container-fluid pt-4 px-4">
    <h2>Registrar pago para: {{ reserva.nombre_evento }}</h2>
    <form method="post">
        {% csrf_token %}
        <p>Total: <input type="number" step="0.01" name="total" class="form-control" required></p>
        <p>Abono: <input type="number" step="0.01" name="abono" class="form-control" value="0"></p>
        <button class="btn btn-primary">Guardar</button>
    </form>
</div>
{% endblock %}
